# =========================================================
# APPLICATION
# =========================================================

spring.application.name=securevault-backend

server.port=8080


# =========================================================
# POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/securevault

spring.datasource.username=postgres

spring.datasource.password=Charan@111

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost

spring.data.redis.port=6379

spring.data.redis.timeout=2000ms


# =========================================================
# JWT
# =========================================================

jwt.secret=SecureVaultJWTSecretKey2026VeryLongAndSecureKey12345

jwt.expiration=86400000


# =========================================================
# MAIL
# =========================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=CHANGE_ME_EMAIL

spring.mail.password=CHANGE_ME_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# GOOGLE OAUTH2
# =========================================================

spring.security.oauth2.client.registration.google.client-id=CHANGE_ME_GOOGLE_CLIENT_ID

spring.security.oauth2.client.registration.google.client-secret=CHANGE_ME_GOOGLE_CLIENT_SECRET

spring.security.oauth2.client.registration.google.scope=openid,profile,email


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.security=INFO

logging.level.com.securevault.backend=INFO